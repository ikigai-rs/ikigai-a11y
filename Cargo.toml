[package]
name = "ikigai-a11y"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Accessibility as a resolvable ikigai resource: the layered a11y config (a11y.toml ⊕ {app}.a11y.toml), WCAG contrast math, and a contrast-floor pass that repairs a syntax theme's own CSS in its own palette."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-a11y"
homepage = "https://github.com/ikigai-rs/ikigai-a11y"
readme = "README.md"
keywords = ["ikigai", "accessibility", "wcag", "contrast", "module"]
categories = ["accessibility", "wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
# 0.1.89 is the floor every test here runs against: `ikigai-conformance` 0.6
# (the dev-dependency below) needs it, so nothing older is ever built in CI. The
# API this crate's src calls is older (`config_home` / `layered_paths`, the path
# algebra it reads, parses and merges, arrived in 0.1.56), but a floor no test
# compiles against is a claim, not a minimum. A caret on 0.1.x is also a ceiling
# (`<0.2.0`); the kernel is still on the 0.1 line, so this admits every release.
ikigai-core = "0.1.89"
serde = { version = "1", features = ["derive"] }
# Pure-Rust, wasm-clean: the config half compiles to wasm32-unknown-unknown.
toml = "0.8"
serde_json = "1"

# The `themes` face: mapping a configured theme NAME to a two-face theme, and
# generating that theme's CSS with the contrast floor already applied. Optional
# and OFF by default, because it drags in syntect and ~2MB of embedded theme
# data that a wasm consumer of the pure halves has no use for.
#
# `default-features = false` + `syntect-fancy` matches ikigai-browse: fancy-regex
# rather than oniguruma, so CI needs no C toolchain.
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
], optional = true }
syntect = { version = "5.3", default-features = false, features = [
    "default-fancy",
], optional = true }

[features]
default = []
themes = ["dep:two-face", "dep:syntect"]

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.6.0 adds `SPACE-NAME`, which
# the test declares both constructors to. A caret on 0.x is a CEILING as well as
# a floor (`"0.6.0"` admits only 0.6.*): raise it deliberately when 0.7 ships.
ikigai-conformance = "0.6.0"

[[example]]
name = "theme_survey"
required-features = ["themes"]
